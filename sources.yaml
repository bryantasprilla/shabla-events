version: 1

settings:
  consecutive_failure_threshold: 3
  request_timeout_s: 20
  user_agent: "shabla-events-bot/1.0 (+https://github.com/bryantasprilla/shabla-events)"

# Selectors were verified against each site's real markup via
# `manage.py test-source`. Sites redesign without notice -- if a source
# starts returning 0 items or errors, re-inspect its markup (see AGENTS.md).

sources:
  # --- Tier 1: Shabla-specific ---
  - id: shabla_sabitiya
    name: "Shabla.bg — Sabitiya (Events archive)"
    tier: 1
    type: structured-calendar
    url: "https://shabla.bg/events/"
    active: true
    geo_tags: [shabla]
    assume_in_range: true
    skip_keyword_filter: true
    selectors:
      list_item: "article.lsvr_event"
      link: "h3.post__title a"
      link_attr: "href"
      title: "h3.post__title a"
      date: "li.post__info-item--date"
      time: "li.post__info-item--time"
      location: "li.post__info-item--location a"

  - id: shabla_novini
    name: "Shabla.bg — Novini (News)"
    tier: 1
    type: html-article-list
    url: "https://shabla.bg/aktualno/novini/"
    active: true
    geo_tags: [shabla]
    assume_in_range: true
    selectors:
      list_item: "li.lsvr-post-list-widget__item"
      link: "h4.lsvr-post-list-widget__item-title a"
      link_attr: "href"
      title: "h4.lsvr-post-list-widget__item-title a"
      date: "p.lsvr-post-list-widget__item-date"

  - id: zora1894_shabla
    name: "NCh Zora 1894 (Shabla cultural center)"
    tier: 1
    type: html-article-list
    url: "https://nch-zora1894shabla.com/novini/"
    active: true
    geo_tags: [shabla]
    assume_in_range: true
    selectors:
      list_item: "div.news_table"
      link: "h3 a"
      link_attr: "href"
      title: "h3 a"
      body: "div[itemprop='text']"
      date: "time.news_data"

  # --- Tier 2: Kavarna / Balchik ---
  - id: kavarna_municipality
    name: "Kavarna.bg — Novini/Aktualno/Sabitiya"
    tier: 2
    type: rss
    url: "https://www.kavarna.bg/novini-aktualno-sybitiya?format=feed&type=rss"
    active: true
    geo_tags: [kavarna]
    assume_in_range: true

  - id: balchik_municipality
    name: "Balchik.bg — Novini"
    tier: 2
    type: html-article-list
    url: "https://www.balchik.bg/bg/novini"
    active: true
    geo_tags: [balchik]
    assume_in_range: true
    selectors:
      list_item: "article"
      link: "h2 a"
      link_attr: "href"
      title: "h2 a"
      body: "p"
      date: "time"
      base_url: "https://www.balchik.bg/"

  # --- Tier 3: Dobrich region ---
  - id: dobrich_media_shabla
    name: "Dobrich.media — Obshtina Shabla category"
    tier: 3
    type: html-article-list
    url: "https://dobrich.media/category/regionalni/obshtinashabla/"
    active: true
    geo_tags: [shabla]
    assume_in_range: true
    selectors:
      list_item: "article"
      link: "h2.post-title a"
      link_attr: "href"
      title: "h2.post-title a"
      body: "div.entry.excerpt"
      date: "p.post-date time"

  - id: pronewsdobrich
    name: "ProNews Dobrich"
    tier: 3
    type: html-article-list
    url: "https://pronewsdobrich.bg/"
    active: true
    geo_tags: [dobrich, shabla, kavarna, balchik, general_toshevo, tervel]
    assume_in_range: false
    selectors:
      list_item: "li.t09_bl"
      link: "a"
      link_attr: "href"
      title: "h3.hdng_02"
      body: "div.t09_meta"

  - id: dobrichonline
    name: "Dobrich Online"
    tier: 3
    type: html-article-list
    url: "https://www.dobrichonline.com/"
    active: true
    geo_tags: [dobrich, shabla, kavarna, balchik]
    assume_in_range: false
    selectors:
      list_item: "div.post-item-small"
      link: "h3.title a"
      link_attr: "href"
      title: "h3.title a"
      date: "p.small-post-meta span"

  - id: dobrudjabg
    name: "Dobrudzha news agency"
    tier: 3
    type: html-article-list
    url: "https://dobrudjabg.com/"
    active: true
    geo_tags: [dobrich, shabla, kavarna, balchik]
    assume_in_range: false
    selectors:
      list_item: "article"
      link: "h3.gdlr-blog-title a"
      link_attr: "href"
      title: "h3.gdlr-blog-title a"
      date: "div.blog-date"

  # --- Tier 4: Varna ---
  - id: visit_varna_calendar
    name: "Visit Varna — Event Calendar"
    tier: 4
    type: structured-calendar
    url: "https://visit.varna.bg/bg/event.html"
    active: true
    geo_tags: [varna]
    assume_in_range: true
    skip_keyword_filter: true
    selectors:
      list_item: "div.list-element"
      link: "div.data-cell a"
      link_attr: "href"
      title: "div.data-cell h2"
      date: "div.date-design"

  - id: varna_culture
    name: "Varna Culture calendar"
    tier: 4
    type: structured-calendar
    url: "https://varnaculture.bg/"
    active: true
    geo_tags: [varna]
    assume_in_range: true
    skip_keyword_filter: true
    selectors:
      list_item: "div.item-index"
      link: "a"
      link_attr: "href"
      title: "h2"
      date: "div.calendar"

  - id: budna_varna
    name: "Budna Varna"
    tier: 4
    type: html-article-list
    url: "https://www.budnavarna.com/"
    active: true
    geo_tags: [varna]
    assume_in_range: false
    selectors:
      list_item: "div.td_module_flex"
      link: ".entry-title a"
      link_attr: "href"
      title: ".entry-title a"
      body: "div.td-excerpt"
      date: "time.entry-date"

  - id: moreto_varna
    name: "Moreto.net (Varna events)"
    tier: 4
    type: html-article-list
    url: "https://www.moreto.net/events.php"
    active: true
    geo_tags: [varna]
    assume_in_range: false
    selectors:
      list_item: "td[height='180']"
      link: "a"
      link_attr: "href"
      title: "div.t5"
      body: "div.t4"
      date: "div.t1"

  # --- Tier 5: Silistra region (edge of 2h range) ---
  - id: portal_silistra
    name: "Portal Silistra"
    tier: 5
    type: html-article-list
    url: "https://www.portal-silistra.eu/"
    active: true
    geo_tags: [silistra, dulovo, tutrakan]
    assume_in_range: false
    selectors:
      list_item: "a.moreNewsItem"
      title: "h6"
      date: "div.articleDivider span"

  - id: silistra_news
    name: "Silistra News"
    tier: 5
    type: html-article-list
    url: "https://silistranews.net/"
    active: true
    geo_tags: [silistra, dulovo, tutrakan]
    assume_in_range: false
    selectors:
      list_item: "ul.grid-list > li"
      link: ".entry-title a"
      link_attr: "href"
      title: ".entry-title a"
      date: "time.entry-date"

  # --- Tier 6: Southeastern Romania (Constanta and south toward the border) ---
  - id: mangalianews_events
    name: "MangaliaNews.ro — Evenimente & Recomandari"
    tier: 6
    type: html-article-list
    url: "https://www.mangalianews.ro/category/stiri/evenimente-recomandari/"
    active: true
    geo_tags: [mangalia]
    assume_in_range: true
    selectors:
      list_item: "div.td_module_10"
      link: "h3.entry-title a"
      link_attr: "href"
      title: "h3.entry-title a"
      body: "div.td-excerpt"
      date: "time.entry-date"

  # Deactivated: mangalia.tv serves a JS reCAPTCHA "Bot Verification" page to
  # non-browser clients, so there is nothing to scrape without bypassing
  # its bot protection (deliberately not attempted).
  - id: mangalia_tv
    name: "Mangalia.TV"
    tier: 6
    type: html-article-list
    url: "https://www.mangalia.tv/"
    active: false
    geo_tags: [mangalia]
    assume_in_range: true
    selectors:
      list_item: "article"
      link: "a"
      link_attr: "href"
      title: "h2"
      body: ".content"
      date: ".date"

  - id: cuget_liber_mangalia
    name: "Cuget Liber (Mangalia)"
    tier: 6
    type: html-article-list
    url: "https://cugetliber.ro/mangalia"
    active: true
    geo_tags: [mangalia]
    assume_in_range: true
    selectors:
      list_item: "div.item.row"
      link: "div.titlu a"
      link_attr: "href"
      title: "div.titlu a"
