  - id: shabla_sabitiya
    name: "Shabla.bg — Sabitiya (Events)"
    tier: 1
    type: html-article-list
    url: "https://shabla.bg/aktualno/sabitiya/"
    active: true
    geo_tags: [shabla]
    assume_in_range: true
    selectors:
