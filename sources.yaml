version: 1

settings:
  consecutive_failure_threshold: 3
  request_timeout_s: 20
  user_agent: "shabla-events-bot/1.0 (+https://github.com/bryantasprilla/shabla-events)"

# Selectors below are placeholders and get corrected against real page
# structure in Milestone 4 (manage.py test-source dry-run fetch).

